window.orbitzSetLanguage=function(payload){

const $=id=>document.getElementById(id);let selected='',sequence=0;
function ufoPhase(age){if(age<1)return'enter';if(age<2)return'hover';if(age<3)return'exit';return'done'}

function obstacleTop(obstacle,floorY){return obstacle.type==='mosquito'?floorY-obstacle.altitude-obstacle.h/2:floorY-obstacle.h}
function runnerHitsObstacle(obstacle,playerY,floorY){const top=obstacleTop(obstacle,floorY),bottom=obstacle.type==='mosquito'?top+obstacle.h:floorY;return obstacle.x<88&&obstacle.x+obstacle.w>45&&playerY>top+8&&playerY-73<bottom}
function nearestUfoCactus(obstacles,characterRight){return obstacles.filter(o=>o.type==='cactus'&&o.x+o.w>characterRight).reduce((nearest,o)=>!nearest||Math.max(0,o.x-characterRight)<Math.max(0,nearest.x-characterRight)?o:nearest,null)}
function validRunnerBest(score){return Number.isSafeInteger(score)&&score>=0&&score<=2147483647}
function shouldShowExternalVideoLink(selectedId,screenHidden,runnerHidden,playerState,playerId){return Boolean(selectedId)&&!screenHidden&&runnerHidden&&(playerState===1||playerState===2)&&playerId===selectedId}

function ufoReadyToSpawn(timeRemaining,activeCount){return timeRemaining<=0&&activeCount===0}

(()=>{
 const canvas=$('runner-canvas'),ctx=canvas.getContext('2d'),panel=$('runner'),help=$('runner-help'),live=$('runner-live'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

 function fireShot(){const sx=44+60,sy=g.y-17,target=g.obs.filter(o=>o.x+o.w>sx).sort((a,b)=>a.x-b.x)[0],vx=640,time=target?Math.max(.04,(target.x-sx)/(vx+g.speed)):0,vy=target?(floor()-target.h*.55-sy)/time:0;g.bullets.push({x:sx,y:sy,vx,vy,life:2});g.fireTimer=0;g.flash=.09}

 const ufoSprite=document.createElement('canvas');ufoSprite.width=72;ufoSprite.height=36;const ufoCtx=ufoSprite.getContext('2d');ufoCtx.save();ufoCtx.translate(36,18);ufoCtx.shadowColor='rgba(93,238,255,.8)';ufoCtx.shadowBlur=6;const ufoHull=ufoCtx.createLinearGradient(-25,-8,25,8);ufoHull.addColorStop(0,'#52677d');ufoHull.addColorStop(.45,'#d7e5ed');ufoHull.addColorStop(1,'#50647b');ufoCtx.fillStyle=ufoHull;ufoCtx.strokeStyle='#d7f8ff';ufoCtx.lineWidth=1.2;ufoCtx.beginPath();ufoCtx.ellipse(0,3,25,8,0,0,Math.PI*2);ufoCtx.fill();ufoCtx.stroke();ufoCtx.shadowBlur=2;ufoCtx.fillStyle='#7de7f4';ufoCtx.beginPath();ufoCtx.ellipse(0,-3,11,8,0,Math.PI,Math.PI*2);ufoCtx.fill();ufoCtx.strokeStyle='rgba(230,253,255,.8)';ufoCtx.beginPath();ufoCtx.ellipse(0,-3,11,8,0,Math.PI,Math.PI*2);ufoCtx.stroke();for(let i=0;i<5;i++){const a=Math.PI+i*Math.PI/4;ufoCtx.fillStyle=i%2?'#8ffaff':'#f8fbac';ufoCtx.beginPath();ufoCtx.arc(Math.cos(a)*20,4+Math.sin(a)*4,1.5,0,Math.PI*2);ufoCtx.fill()}ufoCtx.restore();

 }

$('videos-tab').onclick=()=>setTab('videos');
$('shorts-tab').onclick=()=>setTab('shorts');
$('live-tab').onclick=()=>setTab('live');
$('podcasts-tab').onclick=()=>setTab('podcasts');
$('comments-tab').onclick=()=>setTab('comments');
$('comments-more').onclick=()=>loadComments(true);
$('view-tabs').onkeydown=event=>{if(['ArrowUp','ArrowDown','Home','End'].includes(event.key)){event.preventDefault();const tabs=['videos','shorts','live','podcasts','comments'],index=tabs.indexOf(activeTab);const tab=event.key==='Home'?tabs[0]:event.key==='End'?tabs[tabs.length-1]:tabs[(index+(event.key==='ArrowDown'?1:tabs.length-1))%tabs.length];setTab(tab);$(tab+'-tab').focus();}};

$('settings').onclick=()=>openSettings();
function selectedVideoUrl(){return selected?'https://www.youtube.com/watch?v='+encodeURIComponent(selected):''}
$('copy-video-link').onclick=async()=>{const url=selectedVideoUrl();if(!url)return;const bridge=window.webkit?.messageHandlers?.orbitzCopyLink;if(bridge){bridge.postMessage(bridgeToken+'\n'+url);uiText($('player-action-status'),'youtube.link_copied');return}try{await navigator.clipboard.writeText(url);uiText($('player-action-status'),'youtube.link_copied')}catch{uiText($('player-action-status'),'youtube.copy_link_failed')}};
document.addEventListener('click',event=>{
 const link=event.target.closest?.('a[target="_blank"]');if(!link)return;
 event.preventDefault();
 const bridge=window.webkit?.messageHandlers?.orbitzOpenExternal;
 if(bridge)bridge.postMessage(bridgeToken+'\n'+link.href);
});
let settingsReturnFocus=null;
function windowLayoutState(){if(!$('config').hidden&&$('discovery').hidden&&$('screen').hidden)return 'settings';return $('discovery').hidden?($('screen').hidden?'idle':'player'):'panel'}
function notifyWindowState(){const bridge=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.orbitzWindow;if(bridge)bridge.postMessage(bridgeToken+'\n'+windowLayoutState())}
function openSettings(){if(!$('config').hidden)return;settingsReturnFocus=document.activeElement;$('config').hidden=false;$('config-status').hidden=true;$('language').value=uiLocale;$('key').focus();notifyWindowState()}
function closeSettings(){if($('config').hidden)return;$('config').hidden=true;const target=settingsReturnFocus?.isConnected?settingsReturnFocus:$('settings');settingsReturnFocus=null;target.focus();notifyWindowState()}
function openDiscovery(){$('discovery').hidden=false;$('query').setAttribute('aria-expanded','true');notifyWindowState()}
function closeDiscovery(){$('discovery').hidden=true;$('query').setAttribute('aria-expanded','false');notifyWindowState()}
$('query').addEventListener('focus',openDiscovery);
$('search').addEventListener('click',openDiscovery);
$('config-close').onclick=closeSettings;
$('language').onchange=async()=>{try{await api('language',{locale:$('language').value})}catch(error){uiErrorText($('config-status'),error);$('config-status').hidden=false}};
$('config').onclick=event=>{if(event.target===$('config'))closeSettings()};
$('save').onclick=async()=>{ $('config-status').hidden=true;try{await api('key',{key:$('key').value});$('key').value='';closeSettings();openDiscovery();if(!$('query').value.trim())await loadRecommendations();else uiText($('status'),'youtube.key_saved')}catch(e){$('config-status').hidden=false;uiErrorText($('config-status'),e)}};
$('search').onsubmit=event=>{event.preventDefault();openDiscovery();if(activeTab==='comments')setTab('videos');else searchCurrentTab();};
document.addEventListener('pointerdown',event=>{if(!$('discovery').hidden&&!$('discovery').contains(event.target)&&!$('search').contains(event.target)&&!$('config').contains(event.target)&&event.target!==$('settings'))closeDiscovery()});
document.addEventListener('focusin',event=>{if(!$('discovery').hidden&&!$('discovery').contains(event.target)&&!$('search').contains(event.target)&&!$('config').contains(event.target)&&event.target!==$('settings'))closeDiscovery()});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'){
  if(!$('config').hidden){event.preventDefault();closeSettings();}
  else if(!$('discovery').hidden){event.preventDefault();closeDiscovery();}
  return;
 }
 if(event.key==='Tab'&&!$('config').hidden){
  const items=[...$('config').querySelectorAll('button,input,select,a[href]')].filter(item=>!item.disabled&&item.offsetParent!==null);
  if(!items.length){event.preventDefault();$('config').focus();return;}
  const first=items[0],last=items[items.length-1];
  if(event.shiftKey&&(document.activeElement===first||!$('config').contains(document.activeElement))){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&(document.activeElement===last||!$('config').contains(document.activeElement))){event.preventDefault();first.focus();}
 }
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)notifyWindowState()});

function renderResults(items){$('results').replaceChildren();uiPrune();const data={items};for(const item of data.items){const button=document.createElement('button');button.type='button';const image=document.createElement('img');image.src=item.thumbnail;image.alt='';const text=document.createElement('span');text.className='caption';const title=document.createElement('strong');uiRaw(title,item.title);const channel=document.createElement('small');uiRaw(channel,item.channel);text.append(title,channel);button.append(image,text);button.onclick=()=>{closeDiscovery();play(item.id,item.title)};$('results').append(button)}}
async function loadRecommendations(){
 const seq=++sequence;
 uiText($('status'),'youtube.loading_recommendations');
 try{const data=await api('recommendations',{});if(seq!==sequence)return;
  renderResults(data.items);uiText($('status'),data.items.length?'youtube.recommendations':'youtube.no_recommendations');
 }catch(e){if(seq!==sequence)return;uiErrorText($('status'),e);if(e.code==='key_required')openSettings();}
}
$('query').addEventListener('input',()=>{++sequence;$('submit').disabled=false;});
youtubeAPI().catch(()=>{});
notifyWindowState();

</script></html>
